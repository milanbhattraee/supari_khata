<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>

  <!-- Ledger book -->
  <g transform="translate(128, 96)">
    <!-- Book cover -->
    <rect x="0" y="0" width="256" height="320" rx="16" fill="white" opacity="0.95"/>

    <!-- Left spine -->
    <rect x="0" y="0" width="32" height="320" rx="16" fill="#047857"/>

    <!-- Ledger lines -->
    <line x1="56" y1="80" x2="232" y2="80" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="56" y1="120" x2="232" y2="120" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="56" y1="160" x2="200" y2="160" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="56" y1="200" x2="220" y2="200" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <line x1="56" y1="240" x2="180" y2="240" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Rupee symbol at bottom -->
    <g transform="translate(100, 260)">
      <path d="M 10 0 L 50 0 M 10 12 L 50 12 M 30 0 Q 50 0 50 20 Q 50 32 30 32 L 10 60"
            stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
